<!doctype html>
<html lang="en" data-default-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runway: a 13-week cash flow forecast for small businesses</title>
    <meta name="description" content="A rolling 13-week cash flow forecast from your bank and QuickBooks exports: real days-to-pay per client, recurring bills, sinking funds, scenarios and a safe-to-spend number. Runs in your browser." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%230a0a0a'/><text x='16' y='20.5' font-family='Menlo,monospace' font-size='12' font-weight='600' text-anchor='middle' fill='white'>TR</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var q = new URLSearchParams(location.search).get('mode')
        var m = q === 'light' || q === 'dark' ? q : localStorage.getItem('themeMode')
        document.documentElement.dataset.themeMode = m === 'light' || m === 'dark' ? m : document.documentElement.dataset.defaultMode
      })()
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
